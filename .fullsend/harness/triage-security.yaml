# Local composing child for the triage-security harness.
#
# The URL-pinned base supplies the tokenless triage contract. This local child
# supplies the runner-local pre-script output because Fullsend rejects an
# absolute host-file source inherited from a URL-sourced harness. The child
# mapping wins for this destination during composition.
base: https://raw.githubusercontent.com/RHEcosystemAppEng/sdlc-plugins/9fabe0ef2430e2ad10cd79ff7942cc58ad01f881/harness/triage-security.yaml#sha256=110fb33d880caf1add20e73c8017451378966eeef52ef34aa988e41c35fc1b02

host_files:
  - src: ${FULLSEND_RUN_DIR}/pre/triage-security-input.json
    dest: /sandbox/workspace/.pre-script/triage-security-input.json
    optional: true
