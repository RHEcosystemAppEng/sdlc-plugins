# Local composing child for the triage-security harness.
#
# The URL-pinned base supplies the tokenless triage contract. This local child
# supplies the runner-local mounts because Fullsend rejects an absolute
# host-file source inherited from a URL-sourced harness. host_files are
# concatenated base+child, deduplicated by dest with the child winning
# (ADR-0045).
#
# Vertex credentials follow fullsend's RUNNER-OWNED model, in parity with the
# verify-pr child (.fullsend/harness/verify-pr.yaml — see its header for which
# component exports the variables per fullsend version). The base's
# env/gcp-vertex.env points the sandbox's GOOGLE_APPLICATION_CREDENTIALS at
# /tmp/.gcp-credentials.json; these two mounts deliver that file and the OIDC
# token its external_account config reads:
#   GOOGLE_APPLICATION_CREDENTIALS  local:     service-account key JSON
#                                   GitHub CI: WIF config exported by the runner
#                                   GitLab CI: WIF config from run-agent-job.sh
#   GCP_OIDC_TOKEN_FILE             local:     unset → optional mount skipped
#                                   CI:        runner-provided OIDC token file
# The credential mount stays required so a missing credential fails up front on
# every pinned CLI. This is the sole sandbox credential (inference only); Jira
# credentials stay runner-only in env.runner.
base: https://raw.githubusercontent.com/RHEcosystemAppEng/sdlc-plugins/6b517782bd00cfa8e4425a7e2eb799595d4abc48/harness/triage-security.yaml#sha256=efec19bdba0f60919aae233e7ae1d80cae976eba39b5d05e483c671deb4cdb06

host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: ${FULLSEND_RUN_DIR}/pre/triage-security-input.json
    dest: /sandbox/workspace/.pre-script/triage-security-input.json
    optional: true
