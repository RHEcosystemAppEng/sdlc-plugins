# Runs evals for PRs via workflow_run dispatch, enabling secret access
# for fork PRs. Triggered by eval-pr.yml completion (path-filtered gate).
#
# Trust model:
# - Collaborators with write/admin permission: evals run automatically
# - External contributors: require manual approval via eval-protected environment
#
# All PR identity and skill discovery is derived from the GitHub API —
# no data from the triggering workflow is trusted. The discover job uses
# pulls.listFiles (no checkout). The run-evals job checks out the base
# branch at workspace root (trusted CLAUDE.md) and the PR merge commit
# into a subdirectory, passed to Claude via --add-dir.
#
# Credential isolation: sandbox.credentials.envVars denies GCP/Vertex AI
# env vars from sandboxed Bash subprocesses. Claude Code's own runtime
# retains access for API authentication.
#
# See docs/specs/2026-05-07-eval-pr-fork-dispatch-design.md for full design.

name: Eval PR Run
run-name: Eval PR Run ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Eval PR"]
    types: [completed]

# Serialize the complete ordinary/native publication sequence for one PR head.
concurrency:
  group: eval-pr-run-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read
  statuses: write

env:
  # Reviewed PR299 suite; normal activation switches this to trusted github.sha.
  NATIVE_EVAL_SOURCE_SHA: b46b2bf647be8451b6aedda58dc8e51448f0eab6

jobs:
  discover:
    name: Discover PR Context
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      author: ${{ steps.pr.outputs.author }}
      trusted: ${{ steps.pr.outputs.trusted }}
      native: ${{ steps.discover.outputs.native }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      source_repo: ${{ steps.pr.outputs.source_repo }}
      source_branch: ${{ steps.pr.outputs.source_branch }}
    steps:
      - &publication-guard
        name: Check latest run before publishing
        id: publication
        if: always()
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        uses: actions/github-script@v9
        with:
          script: &latest-run-check |
            core.setOutput('latest', 'false');
            try {
              const {data: current} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: context.runId
              });
              // workflow_run's own head_sha is main, not the tested PR head.
              // The API run title binds this consumer to the triggering PR head.
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: current.workflow_id, event: 'workflow_run',
                created: `>=${current.created_at}`, per_page: 100
              });
              const matching = runs.filter(r => r.display_title === `Eval PR Run ${process.env.HEAD_SHA}`);
              const latest = matching.sort((a,b) => b.run_number - a.run_number)[0];
              if (latest?.id !== context.runId || current.run_attempt !== context.runAttempt) {
                core.info('Superseded or unidentifiable run; skipping publication');
                return;
              }
              core.setOutput('latest', 'true');
            } catch (error) {
              core.setFailed('Cannot determine latest eval run; refusing publication');
            }

      - name: Set pending commit status
        if: steps.publication.outputs.latest == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              description: 'Eval run in progress...',
              context: 'Eval PR Run',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Resolve PR identity and check trust
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            // listPullRequestsAssociatedWithCommit returns empty for fork PRs
            // because the commit lives in the fork's repo, not the base repo's
            // commit graph. Use pulls.list filtered by base branch instead.
            const headSha = context.payload.workflow_run.head_sha;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            const pr = prs.find(p => p.head.sha === headSha);
            if (!pr) {
              core.setFailed(`No open PR targeting main found for commit ${headSha}`);
              return;
            }
            let { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            // GitHub can return null while computing the merge after a push.
            for (let attempt = 1; current.merge_commit_sha === null && attempt < 3; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 2000));
              ({ data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: pr.number
              }));
            }
            const shaPattern = /^[0-9a-f]{40}$/;
            if (current.state !== 'open' || current.base?.ref !== 'main' ||
                current.head?.sha !== headSha ||
                current.head?.repo?.full_name !== context.payload.workflow_run.head_repository?.full_name ||
                !shaPattern.test(current.base?.sha || '') || !shaPattern.test(current.merge_commit_sha || '')) {
              core.setFailed('PR identity/revision changed or merge source unavailable');
              return;
            }
            // Verify the exact merge commit is constructed from this API-associated
            // head and base. No floating pull ref reaches a credentialed job.
            const { data: merge } = await github.rest.git.getCommit({
              ...context.repo, commit_sha: current.merge_commit_sha
            });
            if (merge.parents?.length !== 2 || merge.parents[0]?.sha !== current.base.sha ||
                merge.parents[1]?.sha !== headSha) {
              core.setFailed('Merge source is not the event-associated head/base');
              return;
            }
            core.setOutput('head_sha', headSha);
            core.setOutput('merge_sha', current.merge_commit_sha);
            core.setOutput('base_sha', current.base.sha);
            core.setOutput('source_repo', current.head.repo.full_name);
            core.setOutput('source_branch', current.head.ref);
            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('author', pr.user.login);

            let trusted = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: pr.user.login
              });
              trusted = ['admin', 'write'].includes(data.permission);
              console.log(`Author ${pr.user.login}: permission=${data.permission}, trusted=${trusted}`);
            } catch (e) {
              console.log(`Author ${pr.user.login}: not a collaborator (${e.status}), trusted=false`);
            }

            core.setOutput('trusted', trusted.toString());

      - name: Discover changed skills
        id: discover
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SOURCE_BRANCH: ${{ steps.pr.outputs.source_branch }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            console.log(`Changed files (${files.length}):`);
            files.forEach(f => console.log(`  ${f.filename}`));

            const skillPattern = /^plugins\/sdlc-workflow\/skills\/([^/]+)\//;
            const evalPattern = /^evals\/([^/]+)\//;
            const candidates = new Set();
            const filenames = new Set(files.map(f => f.filename));

            for (const f of files) {
              const match = f.filename.match(skillPattern) || f.filename.match(evalPattern);
              if (match && match[1] !== 'fullsend') candidates.add(match[1]);
            }

            const confirmed = [];
            for (const skill of candidates) {
              if (filenames.has(`evals/${skill}/evals.json`)) {
                confirmed.push(skill);
                continue;
              }
              try {
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `evals/${skill}/evals.json`,
                  ref: process.env.MERGE_SHA
                });
                confirmed.push(skill);
              } catch {
                console.log(`  Skipping ${skill} — no evals.json`);
              }
            }

            const skills = confirmed.join(',');
            // TC-6726 bootstrap restriction: remove only this identity condition
            // during the separately reviewed PR299 activation delivery.
            const bootstrap = prNumber === 299 && process.env.SOURCE_BRANCH === 'verify-pr-fullsend';
            const nativeRelevant = files.some(f =>
              /^evals\/fullsend\//.test(f.filename) ||
              /^evals\/triage-security\//.test(f.filename) ||
              /^plugins\/sdlc-workflow\/skills\/triage-security\//.test(f.filename) ||
              /^plugins\/sdlc-workflow\/(policies\/triage-security\.yaml|providers\/vertex-ai\.yaml|profiles\/fullsend-vertex-ai\.yaml|env\/gcp-vertex\.env|schemas\/triage-security-(input|result)\.schema\.json|scripts\/(validate-output-schema\.sh|strip_extra_properties\.py|test_(fullsend_gate_eval|native_fullsend_eval_ci)\.py))$/.test(f.filename) ||
              /^\.github\/(workflows\/eval-pr(-run)?\.yml|scripts\/run-native-fullsend-evals\.sh)$/.test(f.filename)
            );
            core.setOutput('native', String(bootstrap && nativeRelevant));
            core.setOutput('skills', skills);
            console.log(`Discovered changed skills with evals: ${skills || 'none'}`);

      - name: Recheck latest run before approval status
        id: gate-publication
        if: always()
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        uses: actions/github-script@v9
        with:
          script: *latest-run-check

      - name: Update status for approval gate
        if: steps.gate-publication.outputs.latest == 'true' && steps.pr.outputs.trusted != 'true' && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              description: 'Waiting for approval in eval-protected environment',
              context: 'Eval PR Run',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  gate:
    name: Approval Gate for ${{ needs.discover.outputs.head_sha }}
    needs: discover
    if: >-
      needs.discover.result == 'success' &&
      needs.discover.outputs.trusted != 'true' &&
      (needs.discover.outputs.skills != '' || needs.discover.outputs.native == 'true')
    runs-on: ubuntu-latest
    environment: eval-protected
    steps:
      - env:
          APPROVED_HEAD: ${{ needs.discover.outputs.head_sha }}
          APPROVED_MERGE: ${{ needs.discover.outputs.merge_sha }}
        run: echo "Approved revision $APPROVED_HEAD / merge $APPROVED_MERGE"

  run-evals:
    name: Run PR Evals
    needs: [discover, gate]
    if: >-
      !cancelled() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.skills != '' &&
      (needs.discover.outputs.trusted == 'true' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout PR merge commit into subdirectory
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.merge_sha }}
          persist-credentials: false
          path: pr-head
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Install sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Write sandbox settings
        run: |
          cat > /tmp/eval-sandbox-settings.json << 'SETTINGS'
          {
            "sandbox": {
              "enabled": true,
              "autoAllowBashIfSandboxed": true,
              "credentials": {
                "envVars": [
                  { "name": "ANTHROPIC_VERTEX_PROJECT_ID", "mode": "deny" },
                  { "name": "CLOUD_ML_REGION", "mode": "deny" },
                  { "name": "GOOGLE_APPLICATION_CREDENTIALS", "mode": "deny" },
                  { "name": "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE", "mode": "deny" },
                  { "name": "GOOGLE_GHA_CREDS_PATH", "mode": "deny" },
                  { "name": "CLOUDSDK_PROJECT", "mode": "deny" },
                  { "name": "CLOUDSDK_CORE_PROJECT", "mode": "deny" },
                  { "name": "GCP_PROJECT", "mode": "deny" },
                  { "name": "GCLOUD_PROJECT", "mode": "deny" },
                  { "name": "GOOGLE_CLOUD_PROJECT", "mode": "deny" }
                ]
              }
            }
          }
          SETTINGS

      - name: Run PR evals
        env:
          SKILLS_CSV: ${{ needs.discover.outputs.skills }}
          CLAUDE_CODE_USE_VERTEX: "1"
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ secrets.GCP_CLOUD_ML_REGION }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-6"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "claude-opus-4-6"
          ANTHROPIC_MODEL: "claude-opus-4-6"
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          IFS=',' read -ra SKILLS <<< "$SKILLS_CSV"
          failed=0

          for skill in "${SKILLS[@]}"; do
            eval_count=$(jq '.evals | length' "pr-head/evals/${skill}/evals.json")
            workspace="/tmp/${skill}-eval-pr"
            mkdir -p "${workspace}"

            echo "=== Running PR evals for ${skill} (${eval_count} cases) ==="
            echo "Workspace: ${workspace}"

            claude -p "$(cat <<PROMPT
          Use the sdlc-workflow:run-evals skill for skill /${skill}.
          Evals path: pr-head/evals/${skill}/evals.json
          Workspace: ${workspace}
          PROMPT
            )" --permission-mode dontAsk \
              --allowedTools Read Write Bash Skill Agent Glob \
              --settings /tmp/eval-sandbox-settings.json \
              --add-dir pr-head \
              2>&1 || {
              echo "::error::PR eval run failed for ${skill} (exit $?)"
              failed=1
              continue
            }

            echo "--- Workspace contents ---"
            find "${workspace}" -type f 2>/dev/null | head -80 || true
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more eval runs failed"
            exit 1
          fi

      - *publication-guard

      - name: Post eval results review
        if: steps.publication.outputs.latest == 'true'
        env:
          SKILLS_CSV: ${{ needs.discover.outputs.skills }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          MERGE_SHA: ${{ needs.discover.outputs.merge_sha }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const skills = process.env.SKILLS_CSV.split(',').filter(Boolean);
            const prNumber = parseInt(process.env.PR_NUMBER);

            let body = `## Eval Results\n\nSource head: ${process.env.HEAD_SHA}\nMerge: ${process.env.MERGE_SHA}\n\n`;
            for (const skill of skills) {
              const summaryPath = `/tmp/${skill}-eval-pr/summary.md`;
              if (fs.existsSync(summaryPath)) {
                body += fs.readFileSync(summaryPath, 'utf8');
              } else {
                body += `### ${skill}\n\n> No results produced. See workflow logs.\n\n`;
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const marker = '## Eval Results';
            const existing = reviews.find(r =>
              r.user?.login === 'github-actions[bot]' && r.commit_id === process.env.HEAD_SHA && r.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.pulls.updateReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                review_id: existing.id,
                body
              });
            } else {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'COMMENT',
                commit_id: process.env.HEAD_SHA,
                body
              });
            }

  run-native-evals:
    name: Run Native Fullsend Evals
    needs: [discover, gate]
    if: >-
      !cancelled() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.native == 'true' &&
      (needs.discover.outputs.trusted == 'true' || needs.gate.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact tested merge
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.merge_sha }}
          path: pr-head
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout reviewed native eval source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.NATIVE_EVAL_SOURCE_SHA }}
          path: native-eval-source
          persist-credentials: false

      - name: Checkout pinned Fullsend infrastructure
        uses: actions/checkout@v7
        with:
          repository: fullsend-ai/fullsend
          ref: d5f36921ac754705619f38c637ef692873809fbc
          path: upstream-fullsend
          persist-credentials: false

      - name: Install Python3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install trusted native dependencies
        run: bash .github/scripts/run-native-fullsend-evals.sh setup

      - name: Recheck approved revision before WIF
        id: revision
        env:
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          MERGE_SHA: ${{ needs.discover.outputs.merge_sha }}
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          SOURCE_REPO: ${{ needs.discover.outputs.source_repo }}
          SOURCE_BRANCH: ${{ needs.discover.outputs.source_branch }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== 'open' || pr.number !== 299 || pr.base?.ref !== 'main' ||
                pr.head?.ref !== 'verify-pr-fullsend' ||
                pr.head?.sha !== process.env.HEAD_SHA || pr.base?.sha !== process.env.BASE_SHA ||
                pr.merge_commit_sha !== process.env.MERGE_SHA ||
                pr.head?.repo?.full_name !== process.env.SOURCE_REPO ||
                pr.head?.ref !== process.env.SOURCE_BRANCH) {
              core.setFailed('Approved PR revision changed; require a new source-bound run');
            }

      - name: Pre-mask host credential path
        run: echo "::add-mask::${GITHUB_WORKSPACE}/gha-creds-"

      - name: Authenticate native inference with existing Fullsend WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Run trusted native suite against sandbox plugin
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
          CLAUDE_CODE_USE_VERTEX: '1'
          TC6726_PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          TC6726_HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          TC6726_MERGE_SHA: ${{ needs.discover.outputs.merge_sha }}
          TC6726_BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          TC6726_TRUSTED_SHA: ${{ github.sha }}
          TC6726_EVAL_SOURCE_SHA: ${{ env.NATIVE_EVAL_SOURCE_SHA }}
        run: bash .github/scripts/run-native-fullsend-evals.sh run

      - name: Upload only allowlisted source-bound native result
        if: always() && steps.revision.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: native-fullsend-result
          path: ${{ runner.temp }}/tc6726-safe/native-result.json
          if-no-files-found: error
          retention-days: 14

  report-status:
    name: Report Status
    needs: [discover, gate, run-evals, run-native-evals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - *publication-guard

      - name: Download safe native result
        if: needs.discover.outputs.native == 'true' && needs.run-native-evals.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: native-fullsend-result
          path: native-report

      - name: Publish native result alongside ordinary review
        id: native-report
        if: always() && steps.publication.outputs.latest == 'true' && needs.discover.outputs.native == 'true'
        env:
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          MERGE_SHA: ${{ needs.discover.outputs.merge_sha }}
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          EVAL_SOURCE_SHA: ${{ env.NATIVE_EVAL_SOURCE_SHA }}
          NATIVE_RESULT: ${{ needs.run-native-evals.result }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const expected = {pr_number: Number(process.env.PR_NUMBER), head_sha: process.env.HEAD_SHA,
              merge_sha: process.env.MERGE_SHA, base_sha: process.env.BASE_SHA, trusted_sha: process.env.TRUSTED_SHA, eval_source_sha: process.env.EVAL_SOURCE_SHA};
            let body = `## Native Fullsend Eval Results\n\nHead: ${expected.head_sha}\nMerge: ${expected.merge_sha}\nTrusted workflow: ${expected.trusted_sha}\nReviewed eval source: ${expected.eval_source_sha}\n\n`;
            let valid = false;
            if (fs.existsSync('native-report/native-result.json')) {
              const report = JSON.parse(fs.readFileSync('native-report/native-result.json', 'utf8'));
              const counts = {'033-absent': 4, '034-empty': 5, '035-malformed': 5, '036-valid': 7};
              const bound = Object.entries(expected).every(([k,v]) => report.source?.[k] === v);
              const complete = report.complete === true && report.total === 21 &&
                Object.keys(report.outcomes || {}).length === 4 && Object.entries(counts).every(([k,n]) =>
                  Object.keys(report.outcomes?.[k] || {}).length === n && Array.from({length:n}, (_,i) =>
                    report.outcomes?.[k]?.[`assertion_${i+1}`]).every(v => typeof v === 'boolean'));
              if (!bound) { core.setFailed('Native report source mismatch'); return; }
              const passed = Object.values(report.outcomes || {}).flatMap(v => Object.values(v)).filter(v => v === true).length;
              valid = complete && passed === 21 && report.exit_code === 0;
              body += `Native job: ${process.env.NATIVE_RESULT}; complete: ${complete}; ${passed}/21 passed.\n`;
            } else {
              body += 'No safe native result was produced; native execution/approval failed.\n';
            }
            // Only constructed scalar/count data enters the review. No arbitrary
            // rationale, transcript, credential path or PR-controlled Markdown.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: expected.pr_number
            });
            const marker = '## Native Fullsend Eval Results';
            const existing = reviews.find(r =>
              r.user?.login === 'github-actions[bot]' && r.commit_id === expected.head_sha && r.body?.startsWith(marker)
            );
            if (existing) {
              await github.rest.pulls.updateReview({...context.repo, pull_number: expected.pr_number,
                review_id: existing.id, body});
            } else {
              await github.rest.pulls.createReview({...context.repo, pull_number: expected.pr_number,
                commit_id: expected.head_sha, event: 'COMMENT', body});
            }
            if (!valid) core.setFailed('Native evidence incomplete, failed, or missing');

      - name: Set final commit status
        if: always() && steps.publication.outputs.latest == 'true'
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          EVALS_RESULT: ${{ needs.run-evals.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          NATIVE_RESULT: ${{ needs.run-native-evals.result }}
          NATIVE_REQUESTED: ${{ needs.discover.outputs.native }}
          NATIVE_REPORT_RESULT: ${{ steps.native-report.outcome }}
          SKILLS_CSV: ${{ needs.discover.outputs.skills }}
        uses: actions/github-script@v9
        with:
          script: |
            const discoverResult = process.env.DISCOVER_RESULT;
            const evalsResult = process.env.EVALS_RESULT;
            const gateResult = process.env.GATE_RESULT;

            const nativeRequested = process.env.NATIVE_REQUESTED === 'true';
            const ordinaryRequested = Boolean(process.env.SKILLS_CSV);
            const nativeOk = !nativeRequested || (process.env.NATIVE_RESULT === 'success' &&
              process.env.NATIVE_REPORT_RESULT === 'success');
            const ordinaryOk = !ordinaryRequested || evalsResult === 'success';
            const state = discoverResult === 'success' && gateResult !== 'failure' && gateResult !== 'cancelled' &&
              nativeOk && ordinaryOk ? 'success' : 'failure';
            const description = state === 'success' ? 'Requested eval suites completed successfully' :
              'Eval execution, approval or native evidence failed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state,
              description,
              context: 'Eval PR Run',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
