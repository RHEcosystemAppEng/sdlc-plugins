name: Skillsaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Skill Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run skillsaw
        # skillsaw v0 (0.15.0)
        uses: stbenjam/skillsaw@825fc093e8a8a2a7c3fb146de54a850b04724a53
        with:
          strict: false
