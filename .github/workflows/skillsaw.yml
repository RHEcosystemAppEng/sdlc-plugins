name: Skillsaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Skill Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run skillsaw
        uses: stbenjam/skillsaw@b11cf99c18ee5b1b2cb3156094b1a7d39fa0f1c7 # v0.23.0
        with:
          strict: false
