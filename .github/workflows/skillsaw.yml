name: Skillsaw

on:
  push:
    # TEMPORARY: the verify-pr-fullsend entry runs the skill lint on the
    # feature branch before it merges to main. Remove it (leave only `main`)
    # once the feature branch is merged — tracked by TC-5816.
    branches: [main, verify-pr-fullsend]
  pull_request:
    # TEMPORARY: the verify-pr-fullsend entry makes this workflow run as a
    # check on PRs targeting the feature branch (e.g. PR #298). Remove it
    # (leave only `main`) once the feature branch merges to main — TC-5816.
    branches: [main, verify-pr-fullsend]

jobs:
  lint:
    name: Skill Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run skillsaw
        # skillsaw v0 (0.15.0)
        uses: stbenjam/skillsaw@1bf34517f8c38193814a0ff7199d028897fbf344
        with:
          strict: false
