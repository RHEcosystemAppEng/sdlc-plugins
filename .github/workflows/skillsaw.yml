name: Skillsaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Skill Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run skillsaw
        # skillsaw v0 (0.15.0)
        uses: stbenjam/skillsaw@8ce692c2991fbbbd605541f1dbb532521a6b2ca5
        with:
          strict: false
