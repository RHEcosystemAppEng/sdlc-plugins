# Path-filtered trigger for the eval dispatch workflow (eval-pr-run.yml).
# This workflow does no work itself — its completion signals eval-pr-run.yml
# to run via workflow_run.
#
# See docs/specs/2026-05-07-eval-pr-fork-dispatch-design.md for full design.

name: Eval PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/sdlc-workflow/skills/**/*.md'
      - 'evals/**/evals.json'
      - 'evals/fullsend/**'
      - 'evals/triage-security/**'
      - 'plugins/sdlc-workflow/policies/triage-security.yaml'
      - 'plugins/sdlc-workflow/providers/vertex-ai.yaml'
      - 'plugins/sdlc-workflow/profiles/fullsend-vertex-ai.yaml'
      - 'plugins/sdlc-workflow/env/gcp-vertex.env'
      - 'plugins/sdlc-workflow/schemas/triage-security-*.schema.json'
      - 'plugins/sdlc-workflow/scripts/validate-output-schema.sh'
      - 'plugins/sdlc-workflow/scripts/strip_extra_properties.py'
      - 'plugins/sdlc-workflow/scripts/test_fullsend_gate_eval.py'
      - 'plugins/sdlc-workflow/scripts/test_native_fullsend_eval_ci.py'
      - '.github/scripts/run-native-fullsend-evals.sh'
      - '.github/workflows/eval-pr-run.yml'
      - '.github/workflows/eval-pr.yml'

jobs:
  trigger:
    name: Trigger Eval Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "PR touches eval paths — dispatching eval run"
