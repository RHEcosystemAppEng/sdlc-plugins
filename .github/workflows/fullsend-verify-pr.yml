# fullsend verify-pr — CI-gated PR review dispatch (per-repo installation).
#
# Replaces the placeholder. Runs the verify-pr harness agent against a PR after
# its OTHER CI checks reach a terminal state, so the review can treat CI results
# as input data — never as a gate. verify-pr runs whether CI passed or failed
# (TC-6180 Reqs 4, 6, 7).
#
# Why a dedicated workflow (not just the fullsend shim):
#   fullsend has no CI-completion event (no check_suite / check_run /
#   workflow_run TransitionKind), and GitHub's recursion guard suppresses
#   check_suite / check_run for Actions-created suites. An inline
#   `pull_request_target` wait is the only reliable "run after CI" trigger
#   (TC-6180 NFRs).
#
# Why pull_request_target (not pull_request) — fork-PR support (TC-6331):
#   On a `pull_request` run whose head is a FORK, GitHub withholds repo
#   vars/secrets and OIDC (id-token), so `vars.FULLSEND_MINT_URL` resolves empty
#   and the mint step fails ("FULLSEND_MINT_URL is not set"). `pull_request_target`
#   runs the BASE-branch version of this workflow with full access to upstream
#   vars/secrets/OIDC, so fork PRs can dispatch (fullsend ADR-0009). This is safe
#   ONLY because the workflow never checks out or executes fork code — it builds
#   the dispatch matrix from `github.event` alone and hands off to
#   reusable-dispatch.yml, which does its own checkout/mint in base-repo context
#   (guards against "pwn request" credential exfiltration). Defense-in-depth: an
#   `ok-to-test` maintainer-label gate (see the `wait-for-checks` `if:` and the
#   `remove-ok-to-test` job below) — a fork PR dispatches only after a maintainer
#   reviews its code and applies the label, which is auto-removed on every new
#   push to force re-review.
#
# Why this coexists with .github/workflows/fullsend.yaml (the vendor shim):
#   verify-pr is registered in .fullsend/config.base.yaml (the vendor preset
#   base layer), NOT in .fullsend/config.yaml. The shim's harness-dispatch job
#   greps ONLY config.yaml for agents, so it never dispatches verify-pr — no
#   premature or duplicate run on pull_request_target. `fullsend dispatch` /
#   `fullsend run` still see verify-pr because LoadConfig merges config.yaml
#   over config.base.yaml (ADR 0069; reusable-dispatch.yml harness-dispatch).
#
# How Step 2 runs the agent with mint OIDC:
#   The vendor reusable-dispatch workflow exposes a pre-computed `matrix` input
#   for "custom pollers ... to skip the dispatch step and directly invoke
#   harness agents." This workflow IS such a poller: its `on:` types are the
#   CI-side equivalent of the harness CEL trigger (change_proposal +
#   synchronized/opened/reopened; see .fullsend/harness/verify-pr.yaml,
#   TC-6189). We build the single-entry matrix (agent verify-pr, role review)
#   from the PR event and hand it to reusable-dispatch, whose harness-run job
#   mints the review-role GitHub App token via OIDC and runs `fullsend run`.
#   Step 1's wait uses the default GITHUB_TOKEN only — the two token paths are
#   distinct.
#
# Per CONVENTIONS.md §Code Style: YAML 2-space indentation.
name: fullsend verify-pr

on:
  # pull_request_target (not pull_request) so fork-origin PRs get upstream
  # vars/secrets/OIDC for the mint step (TC-6331). `labeled` lets a maintainer
  # applying `ok-to-test` start a run; the `remove-ok-to-test` job keys on
  # `synchronize` to strip the label on every new push.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

# One in-flight verify-pr per PR; a new push cancels the superseded run (both
# the CI wait and any dispatch already handed off).
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  wait-for-checks:
    name: wait-for-checks
    # ok-to-test gate (TC-6331). Gating this job gates the downstream `verify-pr`
    # job too (it `needs` this one). A same-repo (upstream) PR needs no label —
    # it already carries secrets/OIDC — and runs on opened/synchronize/reopened
    # (but not on bare `labeled` events, avoiding a redundant rerun when an
    # unrelated label is added). ANY PR (fork or upstream) also runs the moment a
    # maintainer applies `ok-to-test`. A fork PR therefore dispatches ONLY via
    # that label event; a new push (`synchronize`) removes the label
    # (`remove-ok-to-test` below) and does not run, forcing re-review + re-label.
    if: >-
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.action != 'labeled') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'ok-to-test')
    runs-on: ubuntu-latest
    # Bounds the total wait: a check that never terminates lets this job hit
    # timeout-minutes and fail, which skips the dispatch job below (no-checks /
    # hung-check timeout behavior = SKIP). A normal terminal CI outcome — or a
    # PR with no other checks at all — lets the wait succeed and Step 2 proceed.
    timeout-minutes: 45
    permissions:
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Step 1 — wait for every OTHER check on the PR head to reach a terminal
      # state. Self-excluded via running-workflow-name so it never waits on
      # itself. allowed-conclusions lists ALL terminal conclusions, so a failing
      # or cancelled check still releases the wait (CI result is data, not a
      # gate). fail-on-no-checks:false → a PR with no other checks proceeds.
      - name: Wait for other PR checks
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: wait-for-checks
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          checks-discovery-timeout: 60
          fail-on-no-checks: false
          allowed-conclusions: success,failure,neutral,cancelled,skipped,timed_out,action_required,stale,startup_failure

      # Step 2a — build the single-entry harness matrix for the custom-poller
      # path. Format matches `fullsend dispatch --output-driver gha-matrix`
      # (internal/harnessdispatch/ref.go ExecutionRef). The full PR event is
      # embedded as the event_payload string that harness-run consumes.
      - name: Build verify-pr dispatch matrix
        id: matrix
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          matrix=$(jq -cn \
            --arg repo "${REPO}" \
            --arg num "${PR_NUMBER}" \
            --argjson event "$(cat "${GITHUB_EVENT_PATH}")" \
            '{include:[{
               agent: "verify-pr",
               role: "review",
               source_repo: $repo,
               event_type: "pull_request",
               event_payload: ($event | tojson),
               status_repo: $repo,
               status_number: $num
             }]}')
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  # Step 2b — run verify-pr via the vendor reusable workflow. Passing the
  # pre-computed matrix skips its route + harness-dispatch jobs; harness-run
  # mints the review-role GitHub App token (mint OIDC) and runs the agent.
  # Default `needs` gating means this runs only when the wait job succeeds.
  verify-pr:
    needs: wait-for-checks
    # GitHub validates a reusable-workflow caller's permissions STATICALLY against
    # EVERY nested job in the called workflow — including ones gated by `if:` that
    # never run on this custom-poller (matrix) path. reusable-dispatch.yml's `code`
    # and `fix` jobs declare `contents: write`, so the caller must grant it too, or
    # the run fails at startup ("nested job 'code' is requesting 'contents: write',
    # but is only allowed 'contents: read'"). These permissions are the UNION of
    # all reusable-dispatch nested jobs; the harness-run job that actually executes
    # here reads contents only.
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@v0
    with:
      matrix: ${{ needs.wait-for-checks.outputs.matrix }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      # Pin the fullsend CLI to a released tag (vendor default `job.workflow_sha`
      # floats). Bumped v0.37.0 -> v0.43.0: v0.37.0's bundled OpenShell (0.0.83)
      # never reached sandbox readiness (`not ready after 2m0s` x3 -> `Failed to
      # create sandbox`), while fullsend's own dispatch jobs — same composite
      # action `./.defaults/`, same ubuntu-24.04 runner, differing ONLY in CLI
      # version (they float to latest) — create the sandbox in ~49s. v0.43.0 is
      # the current latest release and carries the newer OpenShell. Tag format
      # matches the vendor's git tags (v-prefixed).
      fullsend_version: "v0.43.0"
      runner_image: ubuntu-24.04
    # The reusable workflow declares Jira credentials under vendor names
    # (JIRA_TOKEN / JIRA_USER_EMAIL); this repo stores them under the canonical
    # names (JIRA_API_TOKEN / JIRA_EMAIL). Map repo secret -> vendor input.
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_EMAIL }}

  # ok-to-test auto-removal (TC-6331). When a fork PR that carries `ok-to-test`
  # is updated with new commits (`synchronize`), strip the label so the next
  # verify-pr run requires a maintainer to review the new code and re-apply it.
  # Scoped to fork PRs only — upstream PRs don't gate on the label, so their
  # maintainer-applied labels are left untouched. Runs base-repo code only (no
  # fork checkout); the default token needs pull-requests:write to edit labels.
  remove-ok-to-test:
    name: remove-ok-to-test
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove ok-to-test on new fork-PR commits
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'ok-to-test',
              });
            } catch (error) {
              // 404 = label already absent (e.g. a rapid second push); ignore.
              if (error.status !== 404) throw error;
            }
