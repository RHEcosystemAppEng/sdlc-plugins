# SYNTHETIC TEST DATA — native test agent; production policy/provider/schema unchanged
role: triage
agent: evals/fullsend/triage-security/agent.md
model: claude-opus-4-8
effort: high
image: ghcr.io/fullsend-ai/fullsend-code@sha256:3055d4f52136a7c89fb8aa1976b468a5f9dd929c6be55fd6cd958e222c6e18ca
readonly_repo: true
plugins:
  - plugins/sdlc-workflow
policy: plugins/sdlc-workflow/policies/triage-security.yaml
providers:
  - vertex-ai
host_files:
  - src: plugins/sdlc-workflow/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  # Generated by the test pre-script after early environment/file validation.
  # Fullsend resolves these against .work/native-config; no host run-dir env is needed.
  - src: pre/triage-security-input.json
    dest: /sandbox/workspace/.pre-script/triage-security-input.json
    optional: true
  - src: pre/tc-6677-gate.env
    dest: /sandbox/workspace/.env.d/zz-tc-6677-gate.env
    optional: true
  # Operator-provided inference credential; native upload only, never staged.
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
pre_script: evals/fullsend/triage-security/prepare-fixture.py
validation_loop:
  script: plugins/sdlc-workflow/scripts/validate-output-schema.sh
  schema: plugins/sdlc-workflow/schemas/triage-security-result.schema.json
  max_iterations: 1
env:
  runner:
    PYTHONDONTWRITEBYTECODE: '1'
    TC6677_SCENARIO: ${TC6677_SCENARIO}
    TC6677_REPO_ROOT: ${TC6677_REPO_ROOT}
    FULLSEND_OUTPUT_SCHEMA: ${TC6677_REPO_ROOT}/plugins/sdlc-workflow/schemas/triage-security-result.schema.json
    FULLSEND_OUTPUT_FILE: agent-result.json
timeout_minutes: 30
version: 1
