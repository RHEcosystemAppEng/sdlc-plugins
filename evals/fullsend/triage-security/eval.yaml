# SYNTHETIC TEST DATA — native gate and release cases; no live Jira post-script
name: fullsend-triage-security-gates
execution:
  skill: triage-security-gate
  mode: case
  timeout: 2400
  parallelism: 1
runner:
  type: cli
  effort: high
  command:
    - '{python}'
    - '{runner}'
    - --agent
    - '{agent}'
    - --workspace
    - '{workspace}'
    - --output-dir
    - '{output_dir}'
    - --scenario
    - '{scenario}'
    - --model
    - '{model}'
    - --effort
    - '{effort}'
models:
  skill: claude-opus-4-8
  judge: claude-opus-4-6
dataset:
  path: cases
outputs:
  - path: output
traces:
  stdout: true
  stderr: true
  events: false
  metrics: true
judges:
  - name: assertion_1
    if: annotations.get("assertion_count", 0) > 0
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 0
    feedback_type: bool
  - name: assertion_2
    if: annotations.get("assertion_count", 0) > 1
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 1
    feedback_type: bool
  - name: assertion_3
    if: annotations.get("assertion_count", 0) > 2
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 2
    feedback_type: bool
  - name: assertion_4
    if: annotations.get("assertion_count", 0) > 3
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 3
    feedback_type: bool
  - name: assertion_5
    if: annotations.get("assertion_count", 0) > 4
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 4
    feedback_type: bool
  - name: assertion_6
    if: annotations.get("assertion_count", 0) > 5
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 5
    feedback_type: bool
  - name: assertion_7
    if: annotations.get("assertion_count", 0) > 6
    prompt_file: evals/fullsend/triage-security/judge.md
    arguments:
      assertion_index: 6
    feedback_type: bool
thresholds:
  assertion_1:
    min_pass_rate: 1.0
  assertion_2:
    min_pass_rate: 1.0
  assertion_3:
    min_pass_rate: 1.0
  assertion_4:
    min_pass_rate: 1.0
  assertion_5:
    min_pass_rate: 1.0
  assertion_6:
    min_pass_rate: 1.0
  assertion_7:
    min_pass_rate: 1.0
