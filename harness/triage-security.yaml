# triage-security — standalone root-level Fullsend harness.
#
# The trusted runner gathers every Jira, CVE, lifecycle, and source-repository
# input before sandbox creation. The sandbox receives only the mounted evidence
# bundle and returns a validated action plan; only the trusted post-script may
# execute that plan against Jira.
#
# Caller contract (Fullsend does not set these; see fullsend.md "Adopting
# triage-security"):
#   FULLSEND_RUN_DIR       a fresh, per-run directory exported by the caller.
#                          The pre-script writes pre/triage-security-input.json
#                          there, host_files mounts it, and the post-script
#                          reads it back. Never share it between runs.
#   FULLSEND_WORK_ITEM_URL the Jira Vulnerability to triage.
#   FULLSEND_PROJECT_ROOT  optional; the directory holding the product's
#                          CLAUDE.md (defaults to the fullsend run CWD).
# Schemas resolve from pinned content, never from the target repo: the
# pre-script validates against the input schema co-located in its scripts/
# directory (the only directory Fullsend fetches with it); Fullsend validates the
# result against validation_loop.schema and hands that cached path to the
# post-script as FULLSEND_OUTPUT_SCHEMA.

role: triage
agent: plugins/sdlc-workflow/agents/triage-security.md
model: claude-opus-4-8
effort: high
image: ghcr.io/fullsend-ai/fullsend-code@sha256:9743bc7b6e451e0bcea25ae4a67e0c040c296f1fee04c08988ae80c53fafcfe6
readonly_repo: true

plugins:
  - plugins/sdlc-workflow

policy: plugins/sdlc-workflow/policies/triage-security.yaml

# Bare name: the vertex-ai provider and fullsend-vertex-ai egress profile built
# into fullsend (requires fullsend >= v0.45.0; see fullsend.md "Credential delivery").
providers:
  - vertex-ai

# The pre-script writes the complete non-secret bundle before Fullsend creates
# the sandbox. The Vertex environment mount configures the sole sandbox
# credential used automatically for Vertex AI inference; it is not triage input.
host_files:
  - src: plugins/sdlc-workflow/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${FULLSEND_RUN_DIR}/pre/triage-security-input.json
    dest: /sandbox/workspace/.pre-script/triage-security-input.json
    optional: true

pre_script: plugins/sdlc-workflow/scripts/pre-triage-security.sh
post_script: plugins/sdlc-workflow/scripts/post-triage-security.sh

validation_loop:
  # Fail closed: validate the original, unmutated agent output against this
  # schema before any post-processing. The validator must not strip or normalize
  # properties; an unknown or invalid property rejects the iteration before the
  # trusted post-script can consume an action plan.
  script: plugins/sdlc-workflow/scripts/validate-output-schema.sh
  schema: plugins/sdlc-workflow/schemas/triage-security-result.schema.json
  max_iterations: 2

env:
  runner:
    PYTHONDONTWRITEBYTECODE: "1"
    # JIRA_BASE_URL is the Atlassian API gateway; with no JIRA_EMAIL set,
    # jira-client.py sends the token as Bearer. Browse links come from serverInfo.
    JIRA_SERVER_URL: "${JIRA_BASE_URL}"
    JIRA_API_TOKEN: "${JIRA_TOKEN}"
    # The email on record for the token, consumed ONLY by the fullsend CLI:
    # `comment` actions post through execute-actions.py post_jira_comment_native
    # (`fullsend issues post-comment`, Basic auth). fullsend drops JIRA_USER_EMAIL
    # from script environments unless env.runner declares it.
    JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
    JIRA_PROJECT_KEY: "TC"
    FULLSEND_OUTPUT_FILE: "agent-result.json"

timeout_minutes: 30
version: 1
