# Sandbox policy for the triage-security Fullsend harness.
#
# Triage analysis consumes a trusted evidence bundle. Jira, GitHub, CVE
# databases, lifecycle pages, and source repositories remain runner-side, where
# credentials and network access are available. Only inference/telemetry egress
# is permitted from the sandbox.

version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/var/log, /usr, /lib, /lib64, /proc, /dev/urandom, /etc, /opt]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  claude_code:
    name: claude-code
    endpoints:
      - host: "api.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "platform.claude.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "statsig.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "sentry.io"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      - path: "**/pi"
      - path: "**/node"
